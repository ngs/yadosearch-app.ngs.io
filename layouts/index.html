{{ define "main" }}
<div class="hero">
    <div class="container">
        <div class="hero-content">
            <div class="hero-text">
                <img src="/img/icon.svg" alt="{{ .Site.Title }}" class="hero-icon" width="180" height="180">
                <h1>{{ .Params.hero_title }}</h1>
                <p class="hero-description">{{ .Params.hero_description }}</p>
            </div>
        </div>
    </div>
</div>

<div class="features-section">
    <div class="container">
        {{ .Content }}
    </div>
</div>
{{ end }}
